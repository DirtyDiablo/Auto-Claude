# BD Intelligence Platform — Full Stack Docker Compose
# Feature 14: Production Deployment
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f api        # Watch API logs
#   docker compose down               # Stop all services
#   docker compose down -v            # Stop and remove volumes

services:
  # ── Vector Database ───────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - bd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bd_automation}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bd_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Cache / Event Bus ─────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── API Server (FastAPI) ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bd_automation}
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8100
      - WORKERS=${WORKERS:-2}
    volumes:
      - api-data:/app/data
      - ./Engine8_Knowledge/data:/app/Engine8_Knowledge/data
      - ./Engine7_BullhornETL/data:/app/Engine7_BullhornETL/data
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - bd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Workflow Worker ──────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bd_automation}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  bd-network:
    driver: bridge

volumes:
  qdrant-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  api-data:
    driver: local
