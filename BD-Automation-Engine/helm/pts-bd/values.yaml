# Default values for PTS BD Intelligence Platform

global:
  namespace: pts-bd
  imagePullPolicy: IfNotPresent

hubApi:
  replicas: 2
  image: pts-bd/hub-api:latest
  port: 8100
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70

scraperApi:
  replicas: 1
  image: pts-bd/scraper-api:latest
  port: 8200
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

outreachApi:
  replicas: 1
  image: pts-bd/outreach-api:latest
  port: 8300
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

mcpServer:
  replicas: 1
  image: pts-bd/mcp-server:latest
  port: 8400
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

qdrant:
  image: qdrant/qdrant:v1.16.3
  storage: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

neo4j:
  image: neo4j:5.26-community
  storage: 20Gi
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

dashboard:
  replicas: 2
  image: pts-bd/dashboard:latest
  port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

ingress:
  enabled: true
  host: bd.pts-internal.com
  tls: true
  className: nginx

monitoring:
  prometheus:
    enabled: true
    scrapeInterval: 15s
  grafana:
    enabled: true
