# Production overrides — larger resources, higher replicas
hubApi:
  replicas: 4
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 16
    targetCPU: 60

scraperApi:
  replicas: 2

outreachApi:
  replicas: 2

dashboard:
  replicas: 4

qdrant:
  storage: 200Gi
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

neo4j:
  storage: 100Gi
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

ingress:
  enabled: true
  host: bd.pts-internal.com
  tls: true
