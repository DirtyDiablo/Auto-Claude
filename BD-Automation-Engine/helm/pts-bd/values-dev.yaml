# Dev overrides — smaller resources, single replicas
hubApi:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  autoscaling:
    enabled: false

dashboard:
  replicas: 1

qdrant:
  storage: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "4Gi"

neo4j:
  storage: 5Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "4Gi"

ingress:
  enabled: false
