# UltraRAG Pipeline: BD Capture Strategy
name: capture_strategy_pipeline
version: "1.0"
description: Generate comprehensive capture strategy for federal opportunity

stages:
  - name: opportunity_analysis
    type: retrieval
    config:
      source: qdrant
      collection: programs
      top_k: 10
      query_template: "Federal program {program_name} contract details"

  - name: competitor_research
    type: retrieval
    config:
      source: lightrag
      mode: hybrid
      query_template: "Competitors on {program_name}"

  - name: past_performance
    type: retrieval
    config:
      source: qdrant
      collection: contracts
      query_template: "PTS past performance for {program_name}"

  - name: key_contacts
    type: retrieval
    config:
      source: qdrant
      collection: contacts
      top_k: 10
      query_template: "Key contacts for {program_name}"

  - name: synthesis
    type: llm
    config:
      model: claude-sonnet-4-20250514
      prompt_template: |
        Based on the following intelligence:

        ## Opportunity
        {opportunity_analysis}

        ## Competitors
        {competitor_research}

        ## Past Performance
        {past_performance}

        ## Key Contacts
        {key_contacts}

        Generate capture strategy with:
        1. Win probability (Pwin) estimate with rationale
        2. Key win themes (3-5 differentiators)
        3. Teaming strategy (prime/sub, partners needed)
        4. Price-to-win considerations
        5. 90-day action plan with milestones
        6. Risk factors and mitigation strategies

output:
  format: markdown
  sections:
    - executive_summary
    - win_probability
    - win_themes
    - teaming_strategy
    - action_plan
    - risks
