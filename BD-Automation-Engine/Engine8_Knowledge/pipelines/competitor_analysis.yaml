# UltraRAG Pipeline: Competitor Analysis
name: competitor_analysis_pipeline
version: "1.0"
description: Deep competitor analysis for BD strategy

stages:
  - name: company_profile
    type: retrieval
    config:
      source: lightrag
      mode: local
      query_template: "Company profile for {company_name}"

  - name: contract_history
    type: retrieval
    config:
      source: qdrant
      collection: contracts
      top_k: 20
      query_template: "{company_name} contract awards"

  - name: teaming_network
    type: retrieval
    config:
      source: lightrag
      mode: global
      query_template: "Teaming network of {company_name}"

  - name: personnel
    type: retrieval
    config:
      source: qdrant
      collection: contacts
      top_k: 20
      query_template: "Key personnel at {company_name}"

  - name: analysis
    type: llm
    config:
      model: claude-sonnet-4-20250514
      prompt_template: |
        Analyze competitor {company_name}:

        Profile: {company_profile}
        Contracts: {contract_history}
        Network: {teaming_network}
        Key Personnel: {personnel}

        Provide:
        1. Company Overview
           - Size, revenue, employee count
           - Key business areas
           - Security posture (clearances held)

        2. Competitive Strengths
           - Technical capabilities
           - Past performance
           - Pricing history
           - Customer relationships

        3. Weaknesses
           - Known gaps
           - Protests/issues
           - Capacity constraints

        4. Teaming Patterns
           - Frequent partners
           - Subcontractor preferences
           - Joint ventures

        5. Strategic Positioning
           - Market focus
           - Growth areas
           - Recompete strategy

        6. Counter-Strategy Recommendations
           - How to compete against them
           - Potential teaming opportunities
           - Win themes to emphasize

output:
  format: markdown
  sections:
    - company_overview
    - strengths
    - weaknesses
    - teaming_patterns
    - strategic_positioning
    - counter_strategy
