[alembic]
# Path to the migration scripts directory
script_location = %(here)s

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision creation dates (UTC)
timezone = UTC

# Truncate the revision hash to 12 characters
truncate_slug_length = 40

# The database URL is read from the DATABASE_URL environment variable in env.py.
# Do NOT put credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
