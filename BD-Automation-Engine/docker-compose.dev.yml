# BD Intelligence Platform — Development Overrides
# Feature 14: Production Deployment
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Enables hot-reload for API development with source code mounts.

services:
  api:
    volumes:
      - ./Engine8_Knowledge:/app/Engine8_Knowledge
      - ./Engine2_ProgramMapping:/app/Engine2_ProgramMapping
      - ./Engine3_OrgChart:/app/Engine3_OrgChart
      - ./Engine5_Scoring:/app/Engine5_Scoring
      - ./Engine7_BullhornETL:/app/Engine7_BullhornETL
      - ./services:/app/services
      - ./utils:/app/utils
      - ./workflows:/app/workflows
      - ./migrations:/app/migrations
      - ./orchestrator.py:/app/orchestrator.py
    command: >
      python -m uvicorn Engine8_Knowledge.api:app
      --host 0.0.0.0 --port 8100 --reload
      --reload-dir /app/Engine8_Knowledge
      --reload-dir /app/services
    entrypoint: []
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=debug
      - WORKERS=1
    deploy:
      resources:
        limits:
          memory: 2G

  worker:
    volumes:
      - ./workflows:/app/workflows
      - ./Engine8_Knowledge:/app/Engine8_Knowledge
      - ./services:/app/services
    environment:
      - LOG_LEVEL=debug

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"
