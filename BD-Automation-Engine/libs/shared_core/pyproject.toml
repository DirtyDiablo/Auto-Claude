[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-shared-core"
version = "0.1.0"
description = "Shared core utilities for BD Automation Engine"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
