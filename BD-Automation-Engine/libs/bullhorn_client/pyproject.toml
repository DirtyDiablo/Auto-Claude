[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-bullhorn-client"
version = "0.1.0"
description = "Bullhorn CRM client for BD Automation Engine"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
