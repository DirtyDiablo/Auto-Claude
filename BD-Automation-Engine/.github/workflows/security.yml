# Security Scanning — BD-Automation-Engine
# Weekly scan + PR checks

name: Security

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  pull_request:
    branches:
      - develop

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pip-audit ruff

      - name: pip-audit (known CVEs)
        working-directory: BD-Automation-Engine
        run: uv run pip-audit -r requirements.txt || true

      - name: Ruff security rules (bandit equivalent)
        working-directory: BD-Automation-Engine
        run: uv run ruff check . --select S --output-format github

      - name: Detect secrets scan
        uses: Yelp/detect-secrets-action@v2
        with:
          scan_args: '--exclude-files \.lock$|\.json$|data/'
