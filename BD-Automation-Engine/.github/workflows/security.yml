# Security Scanning — BD-Automation-Engine
# Weekly deep scan + lightweight checks on PRs

name: Security

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  pull_request:
    branches:
      - develop

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pip-audit

      - name: pip-audit (known CVEs)
        working-directory: BD-Automation-Engine
        run: uv run pip-audit -r requirements.txt

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect secrets
        uses: Yelp/detect-secrets-action@v2
        with:
          baseline_file: BD-Automation-Engine/.secrets.baseline
          scan_args: '--exclude-files \.lock$|\.json$|data/'
