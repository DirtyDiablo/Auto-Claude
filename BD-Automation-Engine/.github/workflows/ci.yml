# CI Pipeline — BD-Automation-Engine
# Runs on push to working branches and PRs to develop

name: CI

on:
  push:
    branches:
      - 'claude/setup-auto-claude-*'
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dev tools
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install ruff

      - name: Ruff lint
        working-directory: BD-Automation-Engine
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: BD-Automation-Engine
        run: uv run ruff format --check .

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        working-directory: BD-Automation-Engine
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=Engine8_Knowledge \
            --cov=config \
            --cov=services \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -m "not integration and not qdrant and not neo4j and not slow"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: BD-Automation-Engine/coverage.xml

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install mypy

      - name: Mypy type check
        working-directory: BD-Automation-Engine
        run: uv run mypy Engine8_Knowledge/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        working-directory: BD-Automation-Engine
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pip-audit ruff

      - name: Ruff security rules (bandit equivalent)
        working-directory: BD-Automation-Engine
        run: uv run ruff check . --select S --output-format github

      - name: pip-audit (known CVEs)
        working-directory: BD-Automation-Engine
        run: uv run pip-audit -r requirements.txt || true
